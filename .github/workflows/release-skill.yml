name: Release EKS Maturity Advisor Skill

on:
  push:
    tags:
      - "eks-maturity-advisor-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check
        run: npm run check

      - name: Generate skill catalog
        run: npm run skill:catalog

      - name: Package skill
        run: |
          cd skills
          zip -r ../eks-maturity-advisor-${GITHUB_REF_NAME}.zip eks-maturity-advisor

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: eks-maturity-advisor-${{ github.ref_name }}.zip
          generate_release_notes: true
